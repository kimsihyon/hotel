---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: 예약팀
  labels:
    app: 예약팀
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 예약팀
  template:
    metadata:
      labels:
        app: 예약팀
    spec:
      containers:
        - name: 예약팀
          image: username/예약팀:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 120
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: 객실팀
  labels:
    app: 객실팀
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 객실팀
  template:
    metadata:
      labels:
        app: 객실팀
    spec:
      containers:
        - name: 객실팀
          image: username/객실팀:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 120
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5


---


apiVersion: v1
kind: Service
metadata:
  name: 예약팀
  labels:
    app: 예약팀
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: 예약팀


---


apiVersion: v1
kind: Service
metadata:
  name: 객실팀
  labels:
    app: 객실팀
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: 객실팀

